# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# End-to-end fixture for Face D (CONCEPT 03 §7): a real consumer devenv that takes its
# manager commands from the shared Nix closure.
#
# vendomat is a RELATIVE input to the tree under test — portable, because a relative
# path names no machine. It uses `git+file`, not `path`, on purpose: a `path:` input
# copies the whole directory, including vendomat's mutable `.devenv/` state. That
# state changes while a shell runs, so the narHash moves and the copied path becomes
# invalid mid-build (`path ... is not valid`). The git fetcher takes the tracked
# files and the worktree changes, and excludes ignored state.
#
# repoman comes from its published tag: the fixture must not need a sibling checkout
# to run, and the shared command closure is delivered by Vendomat.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Required by `languages.python.version`, which pins the 3.13 the closure is built at.
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
    inputs:
      nixpkgs:
        follows: nixpkgs
  vendomat:
    url: "git+file:../../.."
  repoman:
    url: "git+https://github.com/Bullish-Design/repoman?ref=refs/tags/v0.7.5&dir=modules"
    flake: false

imports:
  - vendomat/modules
  - repoman

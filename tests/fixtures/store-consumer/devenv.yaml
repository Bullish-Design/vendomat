# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# End-to-end fixture for Face D (CONCEPT 03 §7): a real consumer devenv that takes its
# manager commands from the shared Nix closure.
#
# Vendomat is pinned to the published Gate B commit, so this consumer exercises the
# machine-installable closure rather than the current checkout's devenv state.
#
# repoman comes from its published tag: the fixture must not need a sibling checkout
# to run, and the shared command closure is delivered by Vendomat.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Required by `languages.python.version`, which pins the 3.13 the closure is built at.
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
    inputs:
      nixpkgs:
        follows: nixpkgs
  vendomat:
    url: "git+ssh://git@github.com/Bullish-Design/vendomat.git?rev=fd49ef55e571ff2471c6776a82507f95c70efd4a"
  repoman:
    url: "git+https://github.com/Bullish-Design/repoman?ref=refs/tags/v0.9.1&dir=modules"
    flake: false

imports:
  - vendomat/modules
  - repoman

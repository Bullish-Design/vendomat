# Minimal native Machines fixture for P0. The generated lock records both inputs.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  disko:
    url: github:nix-community/disko
    inputs:
      nixpkgs:
        follows: nixpkgs
  home-manager:
    url: github:nix-community/home-manager
    inputs:
      nixpkgs:
        follows: nixpkgs

[project]
name = "vendomat"
version = "0.6.0"
description = "Write a project flake from vendomat.toml, keep source clones, and (later) configure machines from TOML."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" },
]

# One dependency: the command line. The registry, generator, store, and locator use the standard
# library. Nix and Git do the rest, as subprocesses.
dependencies = [
  "typer>=0.12",
]

[dependency-groups]
# Testee 0.5.0 runs the checks declared in devenv.nix (`testee.checks`). It does not bring
# pytest, ruff, or ty with it, so this group names them. Run `testee verify` (or the testee:*
# devenv tasks), not pytest/ruff directly.
# vendomat is not repoman-managed, so testee is depended on directly rather than installed
# by repoman-sync the way roster-managed repos get it.
dev = [
  "testee",
  "pytest",
  "ruff",
  "ty",
]

[tool.uv.sources]
# A git tag, not `path = "../testee"`. testee is not on PyPI, so uv needs a source, and a
# RELATIVE path resolves beside whatever directory the clone happens to sit in — a fresh
# clone's `uv sync` then fails with "Distribution not found". Commit the portable shape.
#
# There is no local override for this line: uv refuses a `sources` table in uv.toml
# ("`sources` is only applicable in the context of a project"). Keep this tag equal to the
# tag that pins the Testee module and package in devenv.nix and to the host `testee` wrapper.
testee = { git = "https://github.com/Bullish-Design/testee", tag = "v0.5.0" }

[project.scripts]
vendomat = "vendomat.cli:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendomat"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "tests",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The ty check runs `ty check src tests`; scope it to package + tests so it never scans .scratch/ etc.
[tool.ty.src]
include = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]
# Like ty above: .scratch/ holds research prototypes, not package code.
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

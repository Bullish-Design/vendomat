[project]
name = "vendomat"
version = "0.7.0-rc.1"
description = "Compose pinned devenv workspaces and NixOS machines from native modules."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" },
]

# One dependency: the command line. The registry, generator, store, and locator use the standard
# library. Nix and Git do the rest, as subprocesses.
dependencies = [
  "typer>=0.12",
]

[dependency-groups]
# Testee 0.5.1 runs the checks declared in devenv.nix (`testee.checks`). Testee is the host
# wrapper (`~/.nix-profile/bin/testee`). It starts before devenv, so this group does not carry it.
# The checks need pytest, ruff, and ty, so this group names them. Run `testee verify` (or the
# testee:* devenv tasks), not pytest/ruff directly.
dev = [
  "pytest",
  "ruff",
  "ty",
]

[project.scripts]
vendomat = "vendomat.cli:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendomat"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "tests",
  "templates",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The ty check runs `ty check src tests`; scope it to package + tests so it never scans .scratch/ etc.
[tool.ty.src]
include = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]
# Like ty above: .scratch/ holds research prototypes, not package code.
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Inputs that the catalog module needs. A workspace that imports `vendomat/devenv` inherits them.
# `nixpkgs` is not listed here: the workspace sets it to follow `vendomat/nixpkgs`.
inputs:
  # Python versions (`languages.python.version`).
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
    inputs:
      nixpkgs:
        follows: nixpkgs
  # Rust versions (`languages.rust.version`).
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
